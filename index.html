<style>
:root{
  --ink:#0C1A15; --ink2:#132622; --rule:#20443A; --edge:#2B5A4B;
  --chalk:#EFEAE0;   /* primary   14.9:1 */
  --mist:#C3D0C8;    /* secondary 11.2:1 */
  --sage:#A8BCB1;    /* labels     8.9:1 */
  --amber:#E8B152;   /* accent     9.2:1 */
  --grape:#EC8F94;   /* prep       7.6:1 */
  --display:'Bodoni Moda',Georgia,'Times New Roman',serif;
  --body:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  background:#0C1A15;            /* literal, so the page can never fall back to white */
  color-scheme:dark;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body{
  margin:0;background:#0C1A15;color:#EFEAE0;
  font-family:var(--body);font-size:15px;line-height:1.45;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input{font-family:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.hidden{display:none !important}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:#0C1A15;               /* solid: backdrop-filter renders as a white wash on some iOS builds */
  border-bottom:1px solid var(--edge);
  padding:calc(11px + env(safe-area-inset-top)) var(--pad) 0;
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--body);font-weight:600;font-size:11.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--sage)}
.readout{font-family:var(--mono);font-size:12px;color:var(--sage);font-variant-numeric:tabular-nums}
.readout b{color:var(--amber);font-weight:500}
nav{display:flex;gap:26px;margin-top:12px}
nav button{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;
  color:var(--sage);padding:0 0 11px;position:relative}
nav button[aria-selected="true"]{color:var(--chalk)}
nav button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background:var(--amber)}
main{padding:0 var(--pad)}

/* ---------- slot rule ---------- */
.slot{margin:32px 0 2px;display:flex;align-items:center;gap:12px}
.slot h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;
  white-space:nowrap;color:var(--chalk)}
.ticks{flex:1;height:9px;display:flex;align-items:flex-end;gap:5px;overflow:hidden}
.ticks i{width:1px;height:4px;background:var(--rule);display:block;flex:none}
.ticks i:nth-child(5n+1){height:9px;background:var(--edge)}
.slot .cnt{font-family:var(--mono);font-size:12.5px;color:var(--sage);font-variant-numeric:tabular-nums}
.slot .cnt.on{color:var(--amber)}

/* ---------- drink row ---------- */
.drink{position:relative;border-bottom:1px solid var(--rule)}
.drink.on{border-bottom-color:var(--edge)}
.drink.on::before{content:"";position:absolute;top:0;bottom:0;width:2px;
  left:calc(var(--pad) * -1);background:var(--amber)}
.row{display:flex;align-items:center;gap:10px}
.rowmain{flex:1;min-width:0;text-align:left;padding:15px 0}
.name{font-family:var(--display);font-size:19.5px;font-weight:400;line-height:1.15;color:var(--chalk)}
.sub{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sage);
  margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  color:var(--mist);border:1px solid var(--edge);font-family:var(--mono);font-size:17px;line-height:1;
  transition:border-color .15s,color .15s}
.step button:active{border-color:var(--amber);color:var(--amber)}
.step input{width:42px;height:34px;text-align:center;padding:0;border:0;
  background:transparent;appearance:none;-webkit-appearance:none;
  font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;
  color:var(--mist);-webkit-text-fill-color:currentColor}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.drink.on .step input{color:var(--amber);font-weight:500}
.step input:focus{outline:0;color:var(--chalk)}

/* ---------- expanded recipe ---------- */
.body{display:none;padding:0 0 20px}
.drink.open .body{display:block}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--sage);margin-bottom:12px}
.spec{border-left:1px solid var(--edge);padding-left:14px}
.spec .l{display:flex;align-items:baseline;gap:10px;padding:4px 0;
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.spec .l .i{flex:1;font-family:var(--body);font-size:14px;color:var(--chalk);min-width:0}
.spec .l .per{color:var(--sage);font-size:12px;min-width:54px;text-align:right}
.spec .l .tot{color:var(--amber);min-width:64px;text-align:right}
.spec .l.gn .i{color:var(--mist)}
.spec .l.gn .tot{color:var(--sage)}
.how{margin-top:14px;font-size:13.5px;line-height:1.55;color:var(--mist);
  border-top:1px dashed var(--rule);padding-top:12px}
.flag{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--grape)}

/* ---------- ingredients ---------- */
.cat{margin:32px 0 8px;font-size:11px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--sage);font-weight:600;display:flex;align-items:center;gap:10px}
.cat::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---------- prep card ---------- */
.prep{margin-top:30px;border:1px solid var(--edge);border-radius:3px;padding:16px;background:var(--ink2)}
.prep h3{margin:0 0 5px;font-family:var(--display);font-size:20px;font-weight:400;color:var(--grape)}
.prep .lede{font-size:13px;line-height:1.5;color:var(--mist);margin-bottom:14px}
.prep .l{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.prep .l .i{flex:1;font-family:var(--body);font-size:14.5px;color:var(--chalk)}
.prep .l .r{color:var(--sage);font-size:11.5px}
.prep .l .v{color:var(--grape);min-width:70px;text-align:right}
.prep .tot{margin-top:13px;font-family:var(--mono);font-size:11.5px;color:var(--sage)}

.empty{margin-top:80px;text-align:center}
.empty p{font-family:var(--display);font-size:20px;margin:0 0 8px;color:var(--chalk)}
.empty small{font-size:13.5px;color:var(--mist)}
.tools{display:flex;gap:10px;margin:28px 0 8px}
.tools button{flex:1;padding:14px;border:1px solid var(--edge);border-radius:3px;
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--mist)}
.tools button:active{border-color:var(--amber);color:var(--amber)}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:#0C1A15;border-top:1px solid var(--edge);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px}
.dock .sum{flex:1;min-width:0}
.dock .big{font-family:var(--display);font-size:27px;line-height:1;color:var(--chalk);
  font-variant-numeric:tabular-nums}
.dock .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--sage);margin-top:5px}
.dock .go{flex:none;background:var(--amber);color:#0C1A15;padding:14px 20px;border-radius:3px;
  font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.dock .go:active{opacity:.82}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(108px + env(safe-area-inset-bottom));z-index:40;
  background:var(--chalk);color:#0C1A15;font-family:var(--mono);font-size:12px;
  padding:9px 15px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .22s}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ---------- run sheet: prep lines ---------- */
.pl{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--rule)}
.pl .tw{flex:1;min-width:0}
.pl .t{font-size:15.5px;color:var(--chalk)}
.pl .s{font-family:var(--mono);font-size:12px;color:var(--sage);margin-top:5px;line-height:1.4}
.pl .v{font-family:var(--mono);font-size:14px;color:var(--amber);
  font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}

/* ---------- run sheet: technique station ---------- */
.tech{margin:40px 0 0;padding-top:20px;border-top:2px solid var(--edge)}
.tech .th{display:flex;align-items:baseline;gap:12px}
.tech h2{margin:0;flex:1;font-family:var(--display);font-size:25px;font-weight:400;color:var(--chalk)}
.tech .n{font-family:var(--mono);font-size:12.5px;color:var(--amber);font-variant-numeric:tabular-nums}
.tech .kit{font-size:13px;line-height:1.5;color:var(--mist);margin-top:6px}

/* ---------- run sheet: build card ---------- */
.card{border-top:1px solid var(--rule);padding:20px 0 22px}
.card .hd{display:flex;align-items:baseline;gap:12px}
.card .hd h3{margin:0;flex:1;font-family:var(--display);font-size:21px;font-weight:400;color:var(--chalk)}
.card .x{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--amber);
  font-variant-numeric:tabular-nums}
.card .glass{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--sage);margin:7px 0 14px}
.note{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--amber)}

/* sunlight, tired eyes, or a stated preference: push everything to primary */
@media (prefers-contrast:more){
  :root{--sage:#DDE6E1;--mist:#EFEAE0;--amber:#F3C878;--grape:#F5B2B6;--edge:#4C7D6B}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Car Boot Bar</h1>
    <div class="readout" id="readout"></div>
  </div>
  <nav>
    <button id="tabDrinks" aria-selected="true">Drinks</button>
    <button id="tabMake" aria-selected="false">Make</button>
  </nav>
</header>

<main>
  <section id="viewDrinks"></section>
  <section id="viewMake" class="hidden"></section>
</main>

<div class="dock">
  <div class="sum">
    <div class="big" id="dockBig">0</div>
    <div class="lbl" id="dockLbl">drinks to make</div>
  </div>
  <button class="go" id="dockGo">Run sheet</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   INGREDIENTS — names and the few conversions that matter
   at the bar: how much citrus to squeeze, unit words.
   ========================================================== */
const ING={
  gin      :{n:'Gin'},
  vodka    :{n:'Vodka'},
  rum      :{n:'White rum'},
  tequila  :{n:'Tequila blanco'},
  mezcal   :{n:'Mezcal'},
  aperol   :{n:'Aperol'},
  campari  :{n:'Campari'},
  cointreau:{n:'Cointreau'},
  amaretto :{n:'Amaretto'},
  kahlua   :{n:'Kahlúa'},
  lillet   :{n:'Lillet Blanc'},
  prosecco :{n:'Prosecco'},
  tonic    :{n:'Tonic water'},
  ginger   :{n:'Ginger beer'},
  soda     :{n:'Sparkling water'},
  cranberry:{n:'Cranberry juice'},
  pineapple:{n:'Pineapple juice'},
  grapeJ   :{n:'Pink grapefruit juice'},
  water    :{n:'Water'},
  limeJ    :{n:'Lime juice',  squeeze:3, fruit:'limes'},
  lemonJ   :{n:'Lemon juice', squeeze:4, fruit:'lemons'},
  syrup    :{n:'Sugar syrup'},
  coconut  :{n:'Coconut cream'},
  espresso :{n:'Espresso'},

  orangeSl :{n:'Orange slice'},
  limeWdg  :{n:'Lime wedge'},
  limeWhole:{n:'Lime, whole'},
  lemonHalf:{n:'Lemon, halved'},
  lemonTw  :{n:'Lemon twist'},
  pineWdg  :{n:'Pineapple wedge'},
  mint     :{n:'Mint',      u:'sprig',up:'sprigs'},
  basil    :{n:'Basil',     u:'leaf', up:'leaves'},
  eggWhite :{n:'Egg white'},
  coffeeBn :{n:'Coffee beans'},
  angostura:{n:'Angostura', u:'dash', up:'dashes'},
  brownSug :{n:'Brown sugar',u:'tbsp',up:'tbsp'},
  seaSalt  :{n:'Sea salt',  u:'pinch',up:'pinches'},
};

/* Pink Grapefruit Lemonade — 1 : 1 : 6 : 6 */
const PGL={parts:{lemonJ:1,syrup:1,grapeJ:6,water:6},total:14};
const PGLROWS=[['Lemon juice',1],['Sugar syrup',1],['Pink grapefruit juice',6],['Water',6]];

/* things worth cutting, picking or separating before anyone asks for a drink */
const CUT=[
  ['orangeSl','Orange slices'],['limeWdg','Lime wedges'],['lemonTw','Lemon twists'],
  ['pineWdg','Pineapple wedges'],['limeWhole','Whole limes, for muddling'],
  ['lemonHalf','Lemon halves'],['mint','Mint'],['basil','Basil'],
  ['coffeeBn','Coffee beans'],['eggWhite','Egg whites, separated'],
];

/* ==========================================================
   DRINKS — per single serve. [id, amount] = cl.
   [id, amount, 'u'] = counted.  [id, amount, 'g'] = garnish.
   ========================================================== */
const SLOTS=[['day','Daytime'],['eve','Early evening'],['late','Late evening'],['mock','Mocktails']];

const TECHS=[
  ['Build','Ice, jigger, bar spoon. Nothing else needed — these are the fast ones.'],
  ['Shake','Shaker, hawthorne strainer, fine strainer, and a lot of ice.'],
  ['Stir','Mixing glass, bar spoon, your best ice. Never rushed.'],
  ['Muddle','Muddler and crushed ice.'],
];

const DRINKS=[
{id:'aperol',slot:'day',n:'Aperol Spritz',glass:'Wine glass',tech:'Build',
 ing:[['prosecco',12],['aperol',8],['soda',4],['orangeSl',1,'g']],
 how:'Fill a big wine glass with ice. Prosecco, then Aperol, top with soda. One gentle stir.'},

{id:'fifty',slot:'day',n:'50/50 Spritz',glass:'Wine glass',tech:'Build',
 ing:[['prosecco',12],['aperol',4],['campari',4],['soda',4],['orangeSl',1,'g']],
 how:'As the Aperol Spritz — Aperol and Campari go in together over the ice.'},

{id:'campari',slot:'day',n:'Campari Spritz',glass:'Wine glass',tech:'Build',
 ing:[['prosecco',12],['campari',8],['soda',4],['orangeSl',1,'g']],
 how:'As the Aperol Spritz, Campari in place of Aperol. Drier and a good deal more bitter.'},

{id:'london',slot:'day',n:'London Mule',glass:'Mug or highball',tech:'Build',
 ing:[['gin',6],['limeJ',2],['ginger',12],['limeWdg',1,'g']],
 how:'Build over cubed ice: gin, lime, then top with cold ginger beer.'},

{id:'moscow',slot:'day',n:'Moscow Mule',glass:'Mug or highball',tech:'Build',
 ing:[['vodka',6],['limeJ',2],['ginger',12],['limeWdg',1,'g']],
 how:'Build over cubed ice: vodka, lime, then top with cold ginger beer.'},

{id:'paloma',slot:'eve',n:'Mezcal Paloma',glass:'Highball',tech:'Build',
 ing:[['mezcal',5],['limeJ',4],['pgl',12],['seaSalt',1,'u']],
 how:'Salt the rim. Build over ice: mezcal, lime, then top with the pink grapefruit lemonade.'},

{id:'cosmo',slot:'eve',n:'Cosmopolitan',glass:'Coupe',tech:'Shake',
 ing:[['vodka',4],['cointreau',4],['limeJ',4],['cranberry',2]],
 how:'Shake hard with ice, double strain into a chilled coupe.'},

{id:'marg',slot:'eve',n:'Margarita',glass:'Coupe or rocks',tech:'Shake',
 ing:[['tequila',8],['cointreau',4],['limeJ',4],['seaSalt',1,'u'],['limeWdg',1,'g']],
 how:'Salt half the rim so there is a way out. Shake with ice, strain over fresh ice.'},

{id:'gt',slot:'eve',n:'Gin & Tonic',glass:'Balloon or highball',tech:'Build',
 ing:[['gin',4],['tonic',12],['limeWdg',1,'g']],
 how:'Pack the glass with ice, gin first, tonic poured down a bar spoon. Stir once, gently.'},

{id:'smash',slot:'eve',n:'Gin Basil Smash',glass:'Rocks',tech:'Shake',
 ing:[['gin',6],['lemonJ',2.25],['syrup',2.25],['basil',8,'u']],
 how:'Muddle the basil with the lemon, add gin and syrup, shake hard, double strain over ice.'},

{id:'vesper',slot:'eve',n:'Vesper Martini',glass:'Coupe',tech:'Stir',
 ing:[['gin',6],['vodka',2],['lillet',1],['lemonTw',1,'g']],
 how:'Stir with plenty of ice until the mixing glass frosts. Strain, twist lemon over the top.',
 flag:'Your recipe file says 12 / 4 / 2 cl. Halved here to the classic 6 / 2 / 1 — 18 cl of neat spirit is a lot for one coupe. Change it if the file was right.'},

{id:'espresso',slot:'eve',n:'Espresso Martini',glass:'Coupe',tech:'Shake',
 ing:[['vodka',4],['espresso',3],['kahlua',2],['syrup',1],['coffeeBn',3,'g']],
 how:'Pull the espresso fresh and hot. Shake very hard with ice, double strain, float three beans.'},

{id:'amaretto',slot:'late',n:'Amaretto Sour',glass:'Rocks',tech:'Shake',shake:2,
 ing:[['amaretto',4],['limeJ',4],['syrup',2],['angostura',2,'u'],['eggWhite',1,'u']],
 how:'Dry shake with the egg white first, then shake again with ice. Strain over one big cube.',
 flag:'Your recipe file says 12 cl amaretto — 120 ml in a single glass. Set to 4 cl here.'},

{id:'daiquiri',slot:'late',n:'Daiquiri',glass:'Coupe',tech:'Shake',
 ing:[['rum',8],['lemonJ',4],['syrup',2]],
 how:'Shake hard with ice, double strain into a chilled coupe. Yours runs on lemon, not lime.'},

{id:'vmojito',slot:'mock',n:'Virgin Mojito',glass:'Highball',tech:'Muddle',
 ing:[['limeWhole',1,'u'],['lemonHalf',1,'u'],['brownSug',2,'u'],['mint',1,'u'],['soda',15]],
 how:'Muddle lime, lemon and sugar. Clap the mint, drop it in, fill with crushed ice, top with sparkling water.'},

{id:'vpina',slot:'mock',n:'Virgin Piña Colada',glass:'Hurricane',tech:'Shake',
 ing:[['pineapple',15],['coconut',5],['syrup',1],['pineWdg',1,'g']],
 how:'Dry shake first to emulsify the coconut cream, then shake again with ice. Pour unstrained.'},

{id:'pgl',slot:'mock',n:'Pink Grapefruit Lemonade',glass:'Tall glass',tech:'Stir',
 sub:'lemon · pink grapefruit · sugar', parts:1,
 ing:[['pgl',28]],
 how:'Stir together and chill hard. Also the mixer in every Mezcal Paloma, so batch it big.'},
];

/* ==========================================================
   STATE
   ========================================================== */
const KEY='carbootbar.v1';
const store={
  get(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}},
  set(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
};
let counts=store.get()||{}, open=null, tab='drinks';

/* ==========================================================
   HELPERS
   ========================================================== */
function cl(v){
  if(!v) return '0';
  if(v>=100){let s=(v/100).toFixed(2);
    if(s.indexOf('.')>-1)s=s.replace(/0+$/,'').replace(/\.$/,'');return s+' L'}
  return (Math.round(v*100)/100)+' cl';
}
const num=v=>Math.round(v*100)/100;
const s=(n,w)=>n===1?w:w+'s';
function unitWord(g,v){ if(!g.u) return ''; return v===1?g.u:(g.up||g.u+'s') }
function count(g,v){ const w=unitWord(g,v); return w?num(v)+' '+w:num(v)+'×' }

function subtitle(d){
  if(d.sub) return d.sub;
  let a=d.ing.filter(x=>x.length<3&&x[0]!=='soda'&&x[0]!=='water');
  if(!a.length) a=d.ing.slice(0,3);
  return a.slice(0,3).map(x=>x[0]==='pgl'?'grapefruit lemonade':ING[x[0]].n.toLowerCase()).join(' · ');
}

function totals(){
  const vol={},cnt={};let pgl=0,drinks=0;
  for(const d of DRINKS){
    const n=counts[d.id]||0; if(!n) continue; drinks+=n;
    for(const [k,a,u] of d.ing){
      if(u) cnt[k]=(cnt[k]||0)+a*n;
      else if(k==='pgl') pgl+=a*n;
      else vol[k]=(vol[k]||0)+a*n;
    }
  }
  if(pgl) for(const k in PGL.parts) vol[k]=(vol[k]||0)+pgl*PGL.parts[k]/PGL.total;
  return {vol,cnt,pgl,drinks};
}

/* one glass, and the jug — the two numbers you need while pouring */
function specRows(d,m){
  let rows=d.ing;
  if(d.parts) rows=PGLROWS.map(([nm,r])=>[nm,28*r/PGL.total]);
  let h='<div class="spec">';
  for(const row of rows){
    const [k,a,u]=row;
    const nm = d.parts ? k : (k==='pgl' ? 'Pink grapefruit lemonade' : ING[k].n);
    const g  = d.parts ? {} : (ING[k]||{});
    let per,tot;
    if(u){per=count(g,a);tot=count(g,a*m)}
    else {per=num(a)+' cl';tot=cl(a*m)}
    h+='<div class="l'+(u==='g'?' gn':'')+'"><span class="i">'+nm+'</span>'
      +'<span class="per">'+per+'</span><span class="tot">'+tot+'</span></div>';
  }
  return h+'</div>';
}

/* ==========================================================
   DRINKS TAB — set the numbers
   ========================================================== */
function renderDrinks(){
  let h='';
  for(const [sid,sname] of SLOTS){
    const list=DRINKS.filter(d=>d.slot===sid);
    const sum=list.reduce((a,d)=>a+(counts[d.id]||0),0);
    h+='<div class="slot"><h2>'+sname+'</h2><div class="ticks">'+'<i></i>'.repeat(24)+
       '</div><div class="cnt'+(sum?' on':'')+'">'+sum+'</div></div>';
    for(const d of list){
      const n=counts[d.id]||0;
      h+='<div class="drink'+(n?' on':'')+(open===d.id?' open':'')+'">'
        +'<div class="row">'
        +'<button class="rowmain" data-x="open" data-d="'+d.id+'" aria-expanded="'+(open===d.id)+'">'
        +'<div class="name">'+d.n+'</div><div class="sub">'+subtitle(d)+'</div></button>'
        +'<div class="step">'
        +'<button data-x="m" data-d="'+d.id+'" aria-label="One fewer '+d.n+'">−</button>'
        +'<input type="number" inputmode="numeric" min="0" max="999" value="'+n+'" '
        +'data-x="v" data-d="'+d.id+'" aria-label="'+d.n+' servings">'
        +'<button data-x="p" data-d="'+d.id+'" aria-label="One more '+d.n+'">+</button>'
        +'</div></div>'
        +'<div class="body">'+(open===d.id?recipe(d,n):'')+'</div></div>';
    }
  }
  document.getElementById('viewDrinks').innerHTML=h;
}

function recipe(d,n){
  const m=Math.max(n,1);
  let h='<div class="meta">'+d.tech+' · '+d.glass+' · one glass, then ×'+m+'</div>'+specRows(d,m);
  h+='<div class="how">'+d.how+'</div>';
  if(d.flag) h+='<div class="flag">'+d.flag+'</div>';
  return h;
}

/* ==========================================================
   MAKE TAB — mise en place, then how to build everything
   ========================================================== */
function renderMake(){
  const el=document.getElementById('viewMake'), T=totals();
  if(!T.drinks){
    el.innerHTML='<div class="empty"><p>No orders yet</p>'
      +'<small>Set servings on the Drinks tab. This becomes your run sheet — what to prep, then how to build every drink.</small></div>';
    return;
  }
  let h='';

  /* ---- batch and squeeze ---- */
  const batch=[];
  if(T.vol.limeJ)  batch.push(['Lime juice',cl(T.vol.limeJ),
    'squeeze about '+Math.ceil(T.vol.limeJ/ING.limeJ.squeeze)+' limes']);
  if(T.vol.lemonJ) batch.push(['Lemon juice',cl(T.vol.lemonJ),
    'squeeze about '+Math.ceil(T.vol.lemonJ/ING.lemonJ.squeeze)+' lemons']);
  if(T.vol.syrup)  batch.push(['Sugar syrup',cl(T.vol.syrup),
    'or dissolve '+Math.round(T.vol.syrup*10/1.6)+' g sugar in the same in hot water']);
  if(T.vol.espresso) batch.push(['Espresso',Math.ceil(T.vol.espresso/3)+' shots',
    '3 cl each — pull them as you go, not in advance']);

  if(batch.length||T.pgl){
    h+='<div class="cat">Batch and squeeze</div>';
    for(const [t,v,sub] of batch)
      h+='<div class="pl"><div class="tw"><div class="t">'+t+'</div>'
        +'<div class="s">'+sub+'</div></div><div class="v">'+v+'</div></div>';
  }
  if(T.pgl){
    h+='<div class="prep"><h3>Pink Grapefruit Lemonade</h3><div class="lede">'
      +'Make this first. It is the mixer in every Paloma as well as a drink of its own, '
      +'so the total below covers both.</div>';
    for(const [nm,r] of PGLROWS)
      h+='<div class="l"><span class="i">'+nm+'</span><span class="r">'+r+' '+s(r,'part')+'</span>'
        +'<span class="v">'+cl(T.pgl*r/PGL.total)+'</span></div>';
    h+='<div class="tot">'+cl(T.pgl)+' total  ·  ratio 1 : 1 : 6 : 6</div></div>';
  }

  /* ---- cut and pick ---- */
  const cut=CUT.filter(c=>T.cnt[c[0]]);
  if(cut.length){
    h+='<div class="cat">Cut and pick</div>';
    for(const [k,label] of cut){
      const g=ING[k], v=T.cnt[k];
      h+='<div class="pl"><div class="tw"><div class="t">'+label+'</div></div>'
        +'<div class="v">'+count(g,v)+'</div></div>';
    }
  }
  if(T.cnt.seaSalt)
    h+='<div class="pl"><div class="tw"><div class="t">Salt for rims</div></div>'
      +'<div class="v">'+T.cnt.seaSalt+(T.cnt.seaSalt===1?' glass':' glasses')+'</div></div>';

  /* ---- the build sheet ---- */
  for(const [tech,kit] of TECHS){
    const list=DRINKS.filter(d=>d.tech===tech&&counts[d.id]);
    if(!list.length) continue;
    const n=list.reduce((a,d)=>a+counts[d.id],0);
    h+='<div class="tech"><div class="th"><h2>'+tech+'</h2>'
      +'<span class="n">'+n+' '+s(n,'drink')+'</span></div>'
      +'<div class="kit">'+kit+'</div></div>';
    for(const d of list){
      const m=counts[d.id];
      h+='<div class="card"><div class="hd"><h3>'+d.n+'</h3><span class="x">×'+m+'</span></div>'
        +'<div class="glass">'+d.glass+' · '+SLOTS.filter(x=>x[0]===d.slot)[0][1].toLowerCase()+'</div>'
        +specRows(d,m)
        +'<div class="how">'+d.how+'</div>';
      if(tech==='Shake'&&m>=4){
        const per=d.shake||3, r=Math.ceil(m/per);
        h+='<div class="note">'+r+' '+s(r,'round')+' of '+per+' in the shaker'
          +(d.shake?' — the egg white needs room to whip up':'')+'.</div>';
      }
      if(d.flag) h+='<div class="flag">'+d.flag+'</div>';
      h+='</div>';
    }
  }

  h+='<div class="tools"><button id="copyBtn">Copy sheet</button>'
    +'<button id="clearBtn">Clear all</button></div>';
  el.innerHTML=h;
  document.getElementById('copyBtn').onclick=copySheet;
  document.getElementById('clearBtn').onclick=function(){
    if(!confirm('Set every drink back to zero?')) return;
    counts={};store.set(counts);render();toast('Cleared');
  };
}

function copySheet(){
  const T=totals(), out=['CAR BOOT BAR — '+T.drinks+' drinks',''];
  out.push('PREP');
  if(T.vol.limeJ)  out.push('  Lime juice '+cl(T.vol.limeJ)+' — about '+Math.ceil(T.vol.limeJ/3)+' limes');
  if(T.vol.lemonJ) out.push('  Lemon juice '+cl(T.vol.lemonJ)+' — about '+Math.ceil(T.vol.lemonJ/4)+' lemons');
  if(T.vol.syrup)  out.push('  Sugar syrup '+cl(T.vol.syrup));
  if(T.vol.espresso) out.push('  Espresso '+Math.ceil(T.vol.espresso/3)+' shots');
  if(T.pgl){
    out.push('  Pink grapefruit lemonade '+cl(T.pgl)+' (1:1:6:6)');
    for(const [nm,r] of PGLROWS) out.push('     '+nm+' '+cl(T.pgl*r/PGL.total));
  }
  for(const [k,label] of CUT) if(T.cnt[k]) out.push('  '+label+' — '+count(ING[k],T.cnt[k]));
  if(T.cnt.seaSalt) out.push('  Salt rims — '+T.cnt.seaSalt);
  for(const [tech] of TECHS){
    const list=DRINKS.filter(d=>d.tech===tech&&counts[d.id]);
    if(!list.length) continue;
    out.push('','— '+tech.toUpperCase());
    for(const d of list){
      const m=counts[d.id];
      out.push('  '+d.n+' ×'+m+'  ['+d.glass+']');
      let rows=d.parts?PGLROWS.map(([nm,r])=>[nm,28*r/PGL.total]):d.ing;
      for(const [k,a,u] of rows){
        const nm=d.parts?k:(k==='pgl'?'Pink grapefruit lemonade':ING[k].n);
        const g=d.parts?{}:(ING[k]||{});
        out.push('     '+nm+'  '+(u?count(g,a):num(a)+' cl')+'  ->  '+(u?count(g,a*m):cl(a*m)));
      }
      out.push('     '+d.how);
    }
  }
  const txt=out.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){toast('Copied')},function(){fallback(txt)});
  else fallback(txt);
}
function fallback(txt){
  const t=document.createElement('textarea');t.value=txt;
  t.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(t);
  t.focus();t.setSelectionRange(0,txt.length);
  try{document.execCommand('copy');toast('Copied')}catch(e){toast('Could not copy')}
  document.body.removeChild(t);
}

/* ==========================================================
   CHROME
   ========================================================== */
function render(){
  if(tab==='drinks') renderDrinks(); else renderMake();
  const T=totals(), kinds=DRINKS.filter(d=>counts[d.id]).length;
  document.getElementById('dockBig').textContent=T.drinks;
  document.getElementById('dockLbl').textContent=s(T.drinks,'drink')+' to make';
  document.getElementById('readout').innerHTML=T.drinks
    ? '<b>'+kinds+'</b> of '+DRINKS.length+' on the card'
    : DRINKS.length+' drinks on the card';
  document.getElementById('dockGo').textContent=tab==='drinks'?'Run sheet':'Drinks';
}
function setTab(t){
  tab=t;
  document.getElementById('tabDrinks').setAttribute('aria-selected',t==='drinks');
  document.getElementById('tabMake').setAttribute('aria-selected',t==='make');
  document.getElementById('viewDrinks').classList.toggle('hidden',t!=='drinks');
  document.getElementById('viewMake').classList.toggle('hidden',t!=='make');
  render(); window.scrollTo(0,0);
}
let tt;
function toast(m){
  const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show')},1600);
}
function bump(id,d){
  const n=Math.max(0,Math.min(999,(counts[id]||0)+d));
  if(n) counts[id]=n; else delete counts[id];
  store.set(counts);
  if(navigator.vibrate) navigator.vibrate(8);
  render();
}

document.getElementById('tabDrinks').onclick=function(){setTab('drinks')};
document.getElementById('tabMake').onclick=function(){setTab('make')};
document.getElementById('dockGo').onclick=function(){setTab(tab==='drinks'?'make':'drinks')};

document.addEventListener('click',function(e){
  const b=e.target.closest('[data-x]'); if(!b) return;
  const x=b.dataset.x, id=b.dataset.d;
  if(x==='p') bump(id,1);
  else if(x==='m') bump(id,-1);
  else if(x==='open'){open=open===id?null:id;render()}
});
document.addEventListener('input',function(e){
  if(e.target.dataset.x!=='v') return;
  const id=e.target.dataset.d;
  let n=parseInt(e.target.value,10); if(isNaN(n)||n<0)n=0; if(n>999)n=999;
  if(n) counts[id]=n; else delete counts[id];
  store.set(counts);
  document.getElementById('dockBig').textContent=totals().drinks;
  e.target.closest('.drink').classList.toggle('on',!!n);
});
document.addEventListener('focusin',function(e){if(e.target.dataset.x==='v')e.target.select()});
document.addEventListener('change',function(e){if(e.target.dataset.x==='v')render()});

setTab('drinks');
</script>
